name: Corpus snapshots
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "41 2 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated snapshot
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: corpus-snapshot
  cancel-in-progress: false
jobs:
  daily-smoke:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: italia-corpus-pipeline --dry-run --smoke-test "${RUNNER_TEMP}/italia-corpus"
  monthly-snapshot:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 2 1 * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/italia-corpus-download-cache
          key: corpus-zips-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            corpus-zips-${{ runner.os }}-
      - name: Build and publish snapshot
        if: github.event_name == 'schedule' || inputs.publish
        run: >-
          italia-corpus-pipeline
          --download-cache "${RUNNER_TEMP}/italia-corpus-download-cache"
          "${RUNNER_TEMP}/italia-corpus"
        env:
          GITHUB_TOKEN: ${{ secrets.CORPUS_PUBLISH_TOKEN }}
          GITHUB_USERNAME: casungo
          GITHUB_TARGET_REPO: italia-corpus
      - name: Validate full snapshot without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: >-
          italia-corpus-pipeline
          --dry-run
          --download-cache "${RUNNER_TEMP}/italia-corpus-download-cache"
          "${RUNNER_TEMP}/italia-corpus"
      - name: Save verified downloads for the next attempt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/italia-corpus-download-cache
          key: corpus-zips-${{ runner.os }}-${{ github.run_id }}
